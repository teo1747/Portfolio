  { k = "tools", v = "arm-none-eabi-gcc, CMake, Ninja, EmbSIM" },
  { k = "test", v = "Host unit tests with sanitizers, SHA-256 checked against FIPS 180-4 vectors, five system scenarios in simulation" },
]
outcome.en = "All unit tests and simulated system scenarios pass; the simulation caught an I²C race that was then fixed. Not yet run on a physical board."
outcome.fr = "Tous les tests unitaires et scénarios système simulés passent ; la simulation a révélé une course sur l'I²C, corrigée depuis. Pas encore exécuté sur carte physique."

