  { en = "Drivers written on CMSIS registers for an MFRC522 RFID reader on SPI, an SSD1306 OLED, a DS3231 RTC and a 24LC256 EEPROM on I²C, a keypad, servo and buzzer PWM, UART shell and watchdog.", fr = "Drivers écrits sur les registres CMSIS pour un lecteur RFID MFRC522 en SPI, un OLED SSD1306, une RTC DS3231 et une EEPROM 24LC256 en I²C, un clavier, la PWM du servo et du buzzer, un shell UART et le watchdog." },
  { en = "Six tasks over five priority levels, with queues, bus mutexes, an event group for supervisor check-ins, task notifications and stream buffers from UART interrupts.", fr = "Six tâches sur cinq niveaux de priorité, avec queues, mutex de bus, event group pour la supervision, notifications de tâches et stream buffers depuis les interruptions UART." },
  { en = "PINs stored as salted SHA-256 stretched over 1,024 rounds, compared in constant time; CRC-checked records and a ring-buffer access log.", fr = "PIN stockés en SHA-256 salé et étiré sur 1 024 tours, comparés en temps constant ; enregistrements vérifiés par CRC et journal en anneau." },
]
