  { en = "Trained a classifier on the Fruits-360 dataset (131 classes) from ImageNet VGG16 weights, with two dense layers and a softmax head, 224 × 224 input.", fr = "Entraîné un classifieur sur Fruits-360 (131 classes) à partir des poids VGG16 ImageNet, avec deux couches denses et une sortie softmax, entrée 224 × 224." },
  { en = "Wrote an OpenCV detection pipeline based on contours and colour, and an error analysis of the classifier.", fr = "Écrit une chaîne de détection OpenCV fondée sur les contours et la couleur, et une analyse d'erreurs du classifieur." },
