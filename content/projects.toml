# Projects shown on the site, in display order.
# category: professional | academic | personal
# domains: keys from ui.toml [domains]
# env: list of { k = <key from ui.toml [env]>, v = "..." }
# repo: "owner/name" on GitHub, or omit
# Text fields accept **bold**, `code` and [links](https://...).

intro.en = """
Each project lists the problem, what I did, the tools and boards involved, and what came out of it, including what is
not finished. Professional work is described without confidential detail. My personal projects are developed with AI
coding assistants: I set the architecture, specifications and verification strategy, and review what goes in.
"""
intro.fr = """
Chaque projet présente le problème, ce que j'ai fait, les outils et cartes utilisés, et le résultat, y compris ce qui
n'est pas terminé. Les travaux professionnels sont décrits sans détail confidentiel. Mes projets personnels sont développés
avec des assistants de programmation IA : je fixe l'architecture, les spécifications et la stratégie de vérification,
et je relis ce qui est intégré.
"""

# ------------------------------------------------------------------ professional
[[project]]
id = "tcu"
category = "professional"
domains = ["firmware", "automotive", "bringup"]
period = { en = "FORVIA, 2025–2026", fr = "FORVIA, 2025–2026" }
title = { en = "Firmware bring-up of a LIN-controlled heating-element controller", fr = "Mise en route du firmware d'un contrôleur d'élément chauffant piloté en LIN" }
context = { en = "Thermal Control Unit (TCU) on Infineon TLD4020-3ET", fr = "Thermal Control Unit (TCU) sur Infineon TLD4020-3ET" }
summary.en = "C firmware for a heater controller built on an Arm Cortex-M23 with integrated LIN: commands over LIN, heater PWM, NTC-based regulation and fault protection."
summary.fr = "Firmware C d'un contrôleur de chauffe basé sur un Arm Cortex-M23 avec LIN intégré : commandes LIN, PWM de chauffe, régulation par CTN et protections."
problem.en = """
A heating element has to be switched on and off over a LIN bus and regulated from an NTC thermistor. The target is a
new automotive device, the Infineon TLD4020-3ET, first on its evaluation board and later on the real TCU board.
The thermistor divider is supplied from the switched heater output, so during PWM the ADC sees a 100 Hz square wave
instead of a steady voltage.
"""
problem.fr = """
Un élément chauffant doit être commandé en marche/arrêt par bus LIN et régulé à partir d'une thermistance CTN. La cible
est un composant automobile récent, l'Infineon TLD4020-3ET, d'abord sur sa carte d'évaluation puis sur la carte TCU.
Le pont diviseur de la CTN est alimenté par la sortie de chauffe commutée : pendant la PWM, l'ADC voit un signal carré
à 100 Hz au lieu d'une tension stable.
"""
contribution = [
  { en = "Wrote the firmware structure as a state machine: LIN ON/OFF command handling, heater PWM through the LDRV peripheral, ADC acquisition, NTC regulation and fault protection.", fr = "Structure du firmware en machine d'états : traitement des commandes LIN ON/OFF, PWM de chauffe via le périphérique LDRV, acquisition ADC, régulation CTN et protections." },
  { en = "Traced a HardFault in device initialisation to a silicon-revision mismatch: a configuration register missing on the older evaluation silicon. A replacement board resolved it.", fr = "Remonté un HardFault à l'initialisation jusqu'à une révision de silicium différente : un registre de configuration absent sur l'ancienne carte d'évaluation. Une carte de remplacement a réglé le problème." },
  { en = "Traced a lost debug connection to the boot-mode jumper and to USB powering the J-Link and the target at the same time.", fr = "Expliqué une perte de liaison de debug par le cavalier de mode de boot et l'alimentation simultanée du J-Link et de la cible par USB." },
  { en = "Set up printf debugging over the LIN line, read in MobaXterm at 19,200 baud 8N1.", fr = "Mis en place un debug printf sur la ligne LIN, lu sous MobaXterm à 19 200 bauds 8N1." },
  { en = "Synchronised ADC sampling to the PWM on-time: an ISR fires at mid-pulse, 16 samples are averaged and posted to the main loop. The 0 % and 100 % duty cases are constant DC in hardware and needed no special sampling.", fr = "Synchronisé l'échantillonnage ADC sur le temps haut de la PWM : une ISR se déclenche à mi-impulsion, 16 mesures sont moyennées puis transmises à la boucle principale. Les rapports cycliques 0 % et 100 % sont un continu en matériel et ne demandent pas de traitement particulier." },
]
env = [
  { k = "hw", v = "Infineon TLD4020-3ET (Arm Cortex-M23, integrated LIN), TLD4020-3STD_EVAL board, NTC thermistor" },
  { k = "tools", v = "IAR Embedded Workbench, Infineon MCU Configuration Wizard, on-board J-Link, MobaXterm" },
  { k = "lang", v = "C" },
  { k = "proto", v = "LIN" },
]
outcome.en = """
Bring-up blockers cleared on the evaluation board, LIN control and printf-over-LIN debug working, and temperature
readings stable enough for regulation after the PWM-synchronised sampling. Work was done on the evaluation board;
the production TCU board was planned for a later phase.
"""
outcome.fr = """
Blocages de mise en route levés sur la carte d'évaluation, commande LIN et debug printf sur LIN fonctionnels, et mesures
de température assez stables pour la régulation grâce à l'échantillonnage synchronisé. Le travail a été mené sur la carte
d'évaluation ; la carte TCU de série était prévue pour une phase ultérieure.
"""

[[project]]
id = "melibu"
category = "professional"
domains = ["firmware", "automotive", "bringup"]
period = { en = "FORVIA, 2025–2026", fr = "FORVIA, 2025–2026" }
title = { en = "MeLiBu LED driver port: Melexis MLX81116 to MLX81143", fr = "Portage d'un driver LED MeLiBu : Melexis MLX81116 vers MLX81143" }
context = { en = "RP2040 master, MeLiBu 1.x LED bus", fr = "maître RP2040, bus LED MeLiBu 1.x" }
summary.en = "Adapted a working MLX81116 driver to the newer MLX81143 LED controller and made a 154-LED panel display correctly."
summary.fr = "Adaptation d'un driver MLX81116 existant au contrôleur LED MLX81143, plus récent, jusqu'à l'affichage correct d'un panneau de 154 LED."
problem.en = """
A demonstration panel of 22 × 7 RGB LEDs is driven over MeLiBu (Melexis LED bus) by MLX81143 nodes, 14 LEDs each,
from an RP2040. The existing code targeted the MLX81116, which addresses its LEDs differently, and the bus showed
timing faults.
"""
problem.fr = """
Un panneau de démonstration de 22 × 7 LED RVB est piloté en MeLiBu (bus LED Melexis) par des nœuds MLX81143 de 14 LED
chacun, depuis un RP2040. Le code existant visait le MLX81116, qui adresse ses LED différemment, et le bus présentait des
défauts de timing.
"""
contribution = [
  { en = "Compared the two datasheets: same frame format, bit order, CRC and parity, but the MLX81143 uses extended-mode sub-addressing (`subAdr = (data_len - 2) / 2`) for up to 14 LEDs per node.", fr = "Comparé les deux datasheets : même format de trame, ordre des bits, CRC et parité, mais le MLX81143 utilise un sous-adressage en mode étendu (`subAdr = (data_len - 2) / 2`) pour jusqu'à 14 LED par nœud." },
  { en = "Confirmed on the hardware that PWM values are linear 15-bit with no inversion, in R, G, B order.", fr = "Vérifié sur le matériel que les valeurs PWM sont linéaires sur 15 bits, sans inversion, dans l'ordre R, V, B." },
  { en = "Fixed bus timing: the break uses a busy-wait because sleeping hangs with interrupts masked; the critical section covers only the break so UART reception no longer drops bytes; the TX FIFO is drained before the next frame to avoid collisions.", fr = "Corrigé le timing du bus : le break utilise une attente active car la mise en veille bloque sous interruptions masquées ; la section critique ne couvre plus que le break, ce qui supprime les pertes d'octets en réception UART ; la FIFO TX est vidée avant la trame suivante pour éviter les collisions." },
  { en = "Found the wrong bus return pin, and used a PIO-based receiver to confirm that the slaves acknowledge.", fr = "Trouvé une mauvaise broche de retour bus, et utilisé un récepteur PIO pour confirmer les acquittements des esclaves." },
  { en = "Placed the fix for the panel's scrambled LED wiring in the hardware-mapping layer, leaving the input convention untouched.", fr = "Placé la correction du câblage désordonné des LED dans la couche de mapping matériel, sans toucher à la convention d'entrée." },
]
env = [
  { k = "hw", v = "Raspberry Pi RP2040, Melexis MLX81116 and MLX81143, 22 × 7 RGB LED panel" },
  { k = "tools", v = "Raspberry Pi Pico SDK, PIO state machines" },
  { k = "lang", v = "C" },
  { k = "proto", v = "MeLiBu 1.x, UART" },
]
outcome.en = "The MLX81143 panel is driven with correct addressing, colours and LED positions, checked by direct observation of the LEDs."
outcome.fr = "Le panneau MLX81143 est piloté avec l'adressage, les couleurs et les positions de LED corrects, vérifiés par observation directe des LED."

[[project]]
id = "lighting"
category = "professional"
domains = ["software", "automotive", "firmware"]
period = { en = "FORVIA, 2025–2026", fr = "FORVIA, 2025–2026" }
title = { en = "Interior ambient-lighting demonstrator", fr = "Démonstrateur d'éclairage d'ambiance intérieur" }
context = { en = "software owner for a car-interior demonstration buck", fr = "responsable logiciel d'un buck de démonstration d'habitacle" }
summary.en = "A PC application plays video animations across LED strips in a car-interior mock-up through nine STM32 gateways, controlled from an Android tablet."
summary.fr = "Une application PC joue des animations vidéo sur les rubans LED d'une maquette d'habitacle via neuf gateways STM32, pilotée depuis une tablette Android."
problem.en = """
The demonstration buck, a full-size interior mock-up shown to a carmaker, needed dynamic ambient lighting across several zones.
An earlier prototype drove only a few LED displays; the buck needed nine UART gateways kept in step, and a way
to control it without a keyboard.
"""
problem.fr = """
Le buck de démonstration, une maquette d'habitacle à l'échelle 1 présentée à un constructeur, devait recevoir un éclairage
d'ambiance dynamique sur plusieurs zones. Le prototype précédent ne pilotait que quelques afficheurs ; le buck demandait neuf
gateways UART synchronisées et un pilotage sans clavier.
"""
contribution = [
  { en = "Extended the Python/PyQt5 application from a few displays to nine gateways: OpenCV decodes MP4 animations, each LED's logical ID maps to a pixel of the frame, and one worker thread per gateway sends its share at 921,600 baud.", fr = "Étendu l'application Python/PyQt5 de quelques afficheurs à neuf gateways : OpenCV décode les animations MP4, l'identifiant logique de chaque LED correspond à un pixel de la frame, et un thread par gateway envoie sa part à 921 600 bauds." },
  { en = "Kept all nine gateways on the same frame with a thread barrier; zones meant to stay a solid colour run outside the video pipeline.", fr = "Maintenu les neuf gateways sur la même frame grâce à une barrière entre threads ; les zones de couleur fixe restent hors de la chaîne vidéo." },
  { en = "Serial frames are ASCII with delta compression, so only changed LEDs are sent.", fr = "Les trames série sont en ASCII avec compression delta : seules les LED modifiées sont envoyées." },
  { en = "Built the Android tablet app (Kotlin, Jetpack Compose): zones, colours and brightness presets, sent over Bluetooth serial as JSON commands with explicit error codes. Added a keyboard fallback mode.", fr = "Développé l'application tablette Android (Kotlin, Jetpack Compose) : zones, couleurs et presets de luminosité, envoyés en Bluetooth série sous forme de commandes JSON avec codes d'erreur. Ajouté un mode de secours au clavier." },
  { en = "Changed the STM32 gateway firmware as little as possible: when two gateways share a UART line, each filters LED IDs by offset.", fr = "Modifié le firmware des gateways STM32 au minimum : quand deux gateways partagent une ligne UART, chacune filtre les identifiants LED par décalage." },
  { en = "Also maintain a smaller layout-driven variant of the app, where each display is one entry in a zones table.", fr = "Maintenu aussi une variante plus légère de l'application, pilotée par une table de zones où chaque afficheur est une entrée." },
]
env = [
  { k = "hw", v = "STM32 gateways (C firmware), WS2812 LED strips, Android tablet, PC" },
  { k = "lang", v = "Python 3, Kotlin, C" },
  { k = "tools", v = "PyQt5, OpenCV, Jetpack Compose, Android Studio, Git" },
  { k = "proto", v = "UART at 921,600 baud, Bluetooth SPP, JSON" },
]
outcome.en = "Running on the demonstration buck with nine synchronised gateways and tablet control. Documented in my final engineering report."
outcome.fr = "En fonctionnement sur le buck de démonstration avec neuf gateways synchronisées et pilotage par tablette. Documenté dans mon rapport d'ingénieur."

[[project]]
id = "fruit"
category = "professional"
domains = ["software", "vision"]
period = { en = "KMUTT internship, 2025", fr = "Stage KMUTT, 2025" }
title = { en = "Fruit classification for precision agriculture", fr = "Classification de fruits pour l'agriculture de précision" }
