intro.en = """
I write firmware for microcontrollers and bring it up on real hardware: automotive LIN and MeLiBu nodes at FORVIA,
STM32 and PIC32 boards at Polytech Dijon, and VHDL designs on Xilinx FPGAs. In my own time I build an RTOS,
an operating system and the toolchain around them.
"""
intro.fr = """
J'écris du firmware pour microcontrôleurs et je le mets en route sur le matériel : nœuds automobiles LIN et MeLiBu
chez FORVIA, cartes STM32 et PIC32 à Polytech Dijon, conceptions VHDL sur FPGA Xilinx. En parallèle, je développe
un RTOS, un système d'exploitation et la chaîne d'outils qui les accompagne.
"""

[texts]
about.en = """
I graduated in September 2026 from Polytech Dijon with an engineering degree (Master's level) in embedded systems.
My final year was a work-study apprenticeship at FORVIA, in the Surface Activation department, where I brought up
firmware on new automotive silicon and owned the software of an interior-lighting demonstrator.

I work from datasheets and reference manuals, and I like the moment where a fault has to be pinned on the right layer:
silicon revision, jumper, timing, or code. I am looking for a role in embedded software, or in embedded software and
hardware together, where firmware meets real boards.

I grew up in Cameroon, speak English natively and work in French daily.
"""
about.fr = """
Je suis diplômé de Polytech Dijon depuis septembre 2026 (diplôme d'ingénieur en systèmes embarqués, Bac+5).
Ma dernière année s'est déroulée en alternance chez FORVIA, au département Surface Activation : mise en route
de firmware sur de nouveaux composants automobiles et responsabilité du logiciel d'un démonstrateur d'éclairage intérieur.

Je travaille à partir des datasheets et des manuels de référence, et j'aime le moment où il faut attribuer un défaut
à la bonne couche : révision de silicium, cavalier, timing ou code. Je cherche un poste en logiciel embarqué, ou en
logiciel et matériel embarqués, là où le firmware rencontre les cartes.

J'ai grandi au Cameroun ; l'anglais est ma langue maternelle et je travaille en français au quotidien.
"""

